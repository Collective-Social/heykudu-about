<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyKudu A5 Poster - attendance on heykudu.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Exact A5 dimensions for printing: 148mm x 210mm */
        @page {
            size: 148mm 210mm;
            margin: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Screen view preview container */
        .a5-poster {
            width: 148mm;
            height: 210mm;
            min-height: 210mm;
            max-height: 210mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .poster-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                min-height: 0 !important;
                background: transparent !important;
            }
            .a5-poster {
                box-shadow: none !important;
                border: none !important;
                margin: 0 auto !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center">

    <!-- Top Action Bar (Screen Only) -->
    <header class="no-print w-full max-w-5xl px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="/presentations" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                ← Presentations Hub
            </a>
            <span class="text-slate-600">|</span>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">A5 Minimalist</span>
                <span class="text-sm font-bold text-white">HeyKudu QR Poster</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button id="themeToggle" onclick="toggleTheme()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
                <span id="themeIcon">☀️</span>
                <span id="themeText">Light Edition</span>
            </button>

            <!-- Download PNG -->
            <a id="btnDownloadPng" href="/heykudu-a5-poster.png" download="heykudu-a5-poster.png" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Download PNG (300 DPI)
            </a>

            <!-- Download PDF -->
            <a id="btnDownloadPdf" href="/heykudu-a5-poster.pdf" download="heykudu-a5-poster.pdf" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm flex items-center gap-1.5 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Download PDF
            </a>

            <!-- Print Button -->
            <button onclick="window.print()" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white hover:bg-slate-100 text-slate-900 shadow-sm flex items-center gap-1.5 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                Print (A5)
            </button>
        </div>
    </header>

    <!-- Poster Presentation Area -->
    <main class="poster-wrapper flex-1 w-full flex items-center justify-center p-6 md:p-10">

        <!-- ================= PRIMARY: BLUE-TO-INDIGO GRADIENT POSTER ================= -->
        <article id="darkPoster" class="a5-poster rounded-3xl bg-gradient-to-br from-[#1D4ED8] via-[#4F46E5] to-[#7D00FF] text-white shadow-2xl flex flex-col items-center justify-between pt-16 pb-12 px-8 select-none relative">
            <!-- Ambient Glow Overlay -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[340px] h-[340px] bg-white/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- 1. TOP CENTER: HeyKudu Logo Emblem + Brand Name -->
            <div class="relative z-10 flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 flex items-center justify-center mb-1">
                    <img src="images/logo-white.png" alt="HeyKudu Logo" class="w-full h-full object-contain drop-shadow-md">
                </div>
                <span class="text-3xl font-extrabold tracking-tight lowercase text-white drop-shadow-sm">heykudu</span>
            </div>

            <!-- 2. QR CODE AT THE BOTTOM -->
            <div class="relative z-10 flex flex-col items-center">
                <!-- White QR Card with subtle drop shadow -->
                <div class="w-[250px] h-[250px] bg-white rounded-3xl p-4 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] border border-white/60 flex items-center justify-center">
                    <img src="images/heykudu-qr-branded.png" alt="Scan to visit heykudu.com" class="w-full h-full object-contain">
                </div>

                <!-- 3. CAPTION: "attendance on heykudu.com" in all small letters -->
                <div class="mt-6 px-5 py-2 rounded-full bg-white/15 border border-white/30 backdrop-blur-md shadow-sm">
                    <span class="text-sm font-semibold tracking-wide text-white lowercase">attendance on heykudu.com</span>
                </div>
            </div>
        </article>

        <!-- ================= SECONDARY: CLEAN LIGHT PRINT POSTER ================= -->
        <article id="lightPoster" class="a5-poster hidden rounded-3xl bg-gradient-to-b from-[#f8fafc] to-[#f1f5f9] text-[#002f6c] shadow-2xl border border-slate-200 flex flex-col items-center justify-between pt-16 pb-12 px-8 select-none relative">
            <!-- 1. TOP CENTER: HeyKudu Logo (Dark) -->
            <div class="relative z-10 flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 flex items-center justify-center mb-1">
                    <img src="images/logo.png" alt="HeyKudu Logo" class="w-full h-full object-contain">
                </div>
                <span class="text-3xl font-extrabold tracking-tight lowercase text-[#002f6c]">heykudu</span>
            </div>

            <!-- 2. QR CODE AT THE BOTTOM -->
            <div class="relative z-10 flex flex-col items-center">
                <!-- White QR Card -->
                <div class="w-[250px] h-[250px] bg-white rounded-3xl p-4 shadow-lg border border-slate-200 flex items-center justify-center">
                    <img src="images/heykudu-qr-branded-blue.png" alt="Scan to visit heykudu.com" class="w-full h-full object-contain">
                </div>

                <!-- 3. CAPTION: "attendance on heykudu.com" in all small letters -->
                <div class="mt-6 px-5 py-2 rounded-full bg-indigo-50 border border-indigo-200/80 shadow-sm">
                    <span class="text-sm font-semibold tracking-wide text-[#002f6c] lowercase">attendance on heykudu.com</span>
                </div>
            </div>
        </article>

    </main>

    <!-- Theme Switch Script -->
    <script>
        let isLight = false;
        function toggleTheme() {
            isLight = !isLight;
            const darkPoster = document.getElementById('darkPoster');
            const lightPoster = document.getElementById('lightPoster');
            const btnPng = document.getElementById('btnDownloadPng');
            const btnPdf = document.getElementById('btnDownloadPdf');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            if (isLight) {
                darkPoster.classList.add('hidden');
                lightPoster.classList.remove('hidden');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Signature Gradient';
                btnPng.href = '/heykudu-a5-poster-light.png';
                btnPng.download = 'heykudu-a5-poster-light.png';
                btnPdf.href = '/heykudu-a5-poster-light.pdf';
                btnPdf.download = 'heykudu-a5-poster-light.pdf';
            } else {
                darkPoster.classList.remove('hidden');
                lightPoster.classList.add('hidden');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Edition';
                btnPng.href = '/heykudu-a5-poster.png';
                btnPng.download = 'heykudu-a5-poster.png';
                btnPdf.href = '/heykudu-a5-poster.pdf';
                btnPdf.download = 'heykudu-a5-poster.pdf';
            }
        }
    </script>
</body>
</html>
